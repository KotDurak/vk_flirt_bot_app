<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог Персонажей</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
<div class="header">
    <h1>🎭 Каталог Персонажей</h1>
    <p>Выбери своего идеального компаньона</p>
</div>

<div class="search-box">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по имени или описанию...">
</div>

<div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Все</button>
</div>

<div class="stats" id="stats"></div>
<div class="characters-grid" id="charactersGrid">
    <div class="loading">Загрузка персонажей...</div>
</div>

<script src="data/characters.js"></script>
<script src="app.js"></script>
</body>
</html>
