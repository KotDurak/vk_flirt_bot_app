<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог Персонажей</title>
    <!-- Подключаем VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #19191a; color: #fff; padding: 20px; }
        .card { background: #2c2d2e; border-radius: 12px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; border: 1px solid #333; }
        .card:active { transform: scale(0.98); background: #3a3b3c; }
        .card h3 { margin: 0 0 8px 0; color: #e1e3e6; }
        .card p { margin: 0; color: #939699; font-size: 14px; }
        .tag { display: inline-block; background: #4c75a3; color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>
<h2>✨ Выбери персонажа</h2>

<!-- Пример карточки персонажа -->
<div class="card" onclick="selectCharacter('char_5')">
    <h3>Слани</h3>
    <p>Длинные пурпурные волосы, гламурный стиль. Любит дразнить.</p>
    <span class="tag">Четыре Поющих Сердца</span>
    <span class="tag">Доминирование</span>
</div>

<div class="card" onclick="selectCharacter('char_12')">
    <h3>Шира-тян</h3>
    <p>Твоя ИИ-ассистентка по коду и не только.</p>
    <span class="tag">IT</span>
    <span class="tag">Помощь</span>
</div>

<script>
    // 1. Инициализируем VK Bridge при загрузке
    vkBridge.send('VKWebAppInit').then(() => {
        console.log('VK Bridge инициализирован');
    }).catch(err => {
        console.error('Ошибка инициализации:', err);
    });

    // 2. Функция выбора персонажа
    function selectCharacter(charCommand) {
        // Отправляем сообщение в бот от имени пользователя
        vkBridge.send('VKWebAppSendMessage', {
            message: charCommand
        }).then(() => {
            console.log('Сообщение отправлено в бот:', charCommand);
            // Опционально: показать красивое уведомление
            vkBridge.send('VKWebAppShowSnackbar', {
                message: 'Персонаж выбран! Проверь чат с ботом 😺'
            });
        }).catch(err => {
            console.error('Не удалось отправить сообщение:', err);
            vkBridge.send('VKWebAppShowSnackbar', {
                message: 'Ошибка отправки. Попробуй еще раз.'
            });
        });
    }
</script>
</body>
</html>
